[workspace]
members = [".", "crates/nanote-tree-sitter"]

[package]
name = "nanote"
version = "0.2.0"
edition = "2024"

[dependencies]
gpui-kit = { version = "0.8.1", features = ["syntect"] }
chardetng = "1.0.0"
encoding_rs = "0.8.43"
libloading = "0.9.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
