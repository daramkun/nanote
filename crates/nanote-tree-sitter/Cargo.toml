[package]
name = "nanote-tree-sitter"
version = "0.1.0"
edition = "2024"
description = "Optional tree-sitter highlighting plugin for nanote (C ABI cdylib)"

[lib]
name = "nanote_tree_sitter"
crate-type = ["cdylib"]

[dependencies]
tree-sitter-astro-next = "0.1.1"
